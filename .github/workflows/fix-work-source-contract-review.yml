name: Apply Work Source review corrections

on:
  push:
    branches:
      - agent/work-sources-design

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work-sources-design
          fetch-depth: 0

      - name: Patch canonical docs
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('docs/plugin-redesign-release-flow/README.md')
          text = readme.read_text()
          old = 'project context -> work source -> release -> release item -> scope work package -> task'
          new = '''project context -> release -> release item -> scope work package -> task
                                     ^
                                     |
                                work source'''
          if old not in text:
              raise SystemExit('README topology pattern not found')
          readme.write_text(text.replace(old, new, 1))

          arch = Path('docs/plugin-redesign-release-flow/01-arquitectura-objetivo.md')
          text = arch.read_text()
          old = '''ProjectContext Aggregate
          Scope Aggregate
          WorkSourceProvider Aggregate
          Release Aggregate
          ReleaseItem Aggregate
          WorkPackage Aggregate
          Task Aggregate
          ```'''
          new = '''ProjectContext Aggregate
          Scope Aggregate
          Release Aggregate
          ReleaseItem Aggregate
          WorkPackage Aggregate
          Task Aggregate
          ```

          `WorkSourceProvider` no es un agregado canonico del dominio. Es un adapter/configuracion registrada en `ProjectContext`, con capabilities y policy verificables. El estado persistente relevante vive en la configuracion del provider, `source_refs`, revisiones/fingerprints, findings de sync/drift y evidencia de operaciones externas; convertir el provider mismo en agregado introduciria lifecycle y consistencia fuerte innecesarios.'''
          if old not in text:
              raise SystemExit('Architecture aggregate pattern not found')
          arch.write_text(text.replace(old, new, 1))

          contracts = Path('docs/plugin-redesign-release-flow/10-corte-1-2-contratos-ejecucion.md')
          text = contracts.read_text()
          old = '''ProjectContext Aggregate
          Scope Aggregate
          WorkSourceProvider Aggregate
          Release Aggregate
          ReleaseItem Aggregate
          WorkPackage Aggregate
          Task Aggregate
          ```'''
          new = '''ProjectContext Aggregate
          Scope Aggregate
          Release Aggregate
          ReleaseItem Aggregate
          WorkPackage Aggregate
          Task Aggregate
          ```

          `WorkSourceProvider` queda fuera de los agregados canonicos: es adapter/configuracion del Project Context. Sus capabilities, policy y connection refs se validan como contrato; `source_refs`, revisiones/fingerprints, findings y evidencia de operaciones externas contienen el estado persistente necesario para import/sync.'''
          if old not in text:
              raise SystemExit('Execution aggregate pattern not found')
          contracts.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-work-source-contract-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/plugin-redesign-release-flow/README.md \
                  docs/plugin-redesign-release-flow/01-arquitectura-objetivo.md \
                  docs/plugin-redesign-release-flow/10-corte-1-2-contratos-ejecucion.md \
                  .github/workflows/fix-work-source-contract-review.yml
          git commit -m "Refine Work Source domain boundaries"
          git push origin HEAD:agent/work-sources-design
