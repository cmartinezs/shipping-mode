name: PR13 review fixes

on:
  push:
    branches:
      - agent/discovery-plan-4-autonomy

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery-plan-4-autonomy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply review fixes
        run: python3 scripts/pr13-review-fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Rebuild generated artifacts
        run: |
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
      - name: Targeted tests
        run: |
          node runtime/src/lib/tests/autonomy.test.mjs
          node runtime/src/commands/tests/autonomy-approve.test.mjs
          node runtime/src/lib/tests/schema-fixtures.test.mjs
          node runtime/src/tests/dispatcher.test.mjs
      - name: Full verification
        run: npm run verify:next-generation
      - name: Commit fixes and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr13-review-fixes.yml scripts/pr13-review-fixes.py
          git add docs runtime
          git diff --cached --check
          git commit -m "fix Plan 4 autonomy trust boundary"
          git push origin HEAD:agent/discovery-plan-4-autonomy
