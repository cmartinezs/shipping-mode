name: PR23 Final Verification

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.ref == 'agent/corte-2-plan-3-derived-health-closure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-2-plan-3-derived-health-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove review helpers
        run: |
          rm -f .github/pr23-followup.trigger .github/workflows/pr23-finalize-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(review): remove PR23 verification helpers"
          git push origin HEAD:agent/corte-2-plan-3-derived-health-closure
      - name: Build and verify
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Publish generated artifacts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate reviewed Corte 2 artifacts"
            git push origin HEAD:agent/corte-2-plan-3-derived-health-closure
          fi
