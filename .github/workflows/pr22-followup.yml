name: PR22 Follow-up Fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-2-plan-2-release-policy-operational-refs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply reviewed patch
        run: |
          git apply --check .github/pr22-followup.patch
          git apply .github/pr22-followup.patch
          rm -f .github/pr22-followup.patch .github/pr22-followup.trigger .github/workflows/pr22-followup.yml
      - name: Publish source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): preserve Plan 2 candidate semantics"
          git push origin HEAD:agent/corte-2-plan-2-release-policy-operational-refs
      - name: Regenerate and verify
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Publish generated artifacts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate reviewed Plan 2 artifacts"
            git push origin HEAD:agent/corte-2-plan-2-release-policy-operational-refs
          fi
