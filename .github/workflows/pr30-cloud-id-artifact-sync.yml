name: PR30 Cloud ID Artifact Sync

on:
  push:
    branches:
      - agent/corte-3-plan-4-external-provider-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-3-plan-4-external-provider-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Regenerate canonical runtime artifacts
        run: |
          npm run build:schemas
          npm run build:runtime
      - name: Commit generated artifacts and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr30-cloud-id-artifact-sync.yml
          git add runtime/src/generated runtime/dist/shipping-mode.mjs
          git commit -m "build(runtime): enforce UUID-only Atlassian cloudId"
          git push origin HEAD:agent/corte-3-plan-4-external-provider-closure
