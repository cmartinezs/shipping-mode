name: Runtime Foundation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply PR16 review corrections
        run: bash .github/pr16-review-fix.sh
      - name: Install and rebuild
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
      - name: Focused and full verification
        run: |
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Commit product corrections to PR branch
        run: |
          git config user.name "shipping-mode-review-bot"
          git config user.email "shipping-mode-review-bot@users.noreply.github.com"
          git add \
            runtime/src/lib/projectContextValidation.mjs \
            runtime/src/commands/renderers.mjs \
            runtime/src/commands/check.mjs \
            runtime/src/schemas/config.schema.json \
            runtime/src/lib/tests/schema.test.mjs \
            runtime/src/lib/tests/schema-fixtures.test.mjs \
            runtime/src/commands/tests/renderers.test.mjs \
            runtime/src/commands/tests/commands.test.mjs \
            runtime/src/commands/tests/check.test.mjs \
            docs/superpowers/plans/2026-07-27-corte-0-completion-plan-2-git-work-sources-config.md \
            runtime/src/generated/validators.mjs \
            runtime/dist/shipping-mode.mjs
          git diff --cached --check
          git commit -m "fix(corte-0): close Plan 2 review findings"
          git push origin HEAD:agent/corte-0-plan-2-git-work-sources-config
