name: Runtime Foundation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply PR15 source and test corrections
        run: |
          sed -n '1,/^PY$/p' .github/pr15-review-fix.sh | bash
          python3 - <<'PY'
          from pathlib import Path
          p = Path('spikes/host-integration/tests/host-integration.test.mjs')
          text = p.read_text()
          old = '  "init --name <name> [--base-branch <b>] [--vcs git|none] --actor <actor>",'
          new = '  "init --name <name> [--project-type software|non_software|mixed|unknown] [--base-branch <b>] [--vcs git|none] --actor <actor>",'
          if text.count(old) != 1:
              raise SystemExit(f'expected one host-integration help entry, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci --silent
      - name: Rebuild committed artifacts
        run: |
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run verify:artifacts
      - name: Protect planning hook contract
        run: node hooks/tests/protect-planning-state.test.mjs
      - name: Spike manifest contract tests
        run: node spikes/tests/verify-corte-1.2.test.mjs
      - name: Verification script contract tests
        run: node scripts/tests/verify-next-generation.test.mjs
      - name: Host integration contract tests
        run: node spikes/host-integration/tests/host-integration.test.mjs
      - name: Full runtime regression
        run: |
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
      - name: Spike structure verification
        run: node spikes/verify-corte-1.2.mjs --structure-only
      - name: Documentation contract scan
        run: node scripts/scan-next-generation-docs.mjs docs/plugin-redesign-release-flow
      - name: Static contract checks
        run: |
          test -x scripts/protect-planning-state-hook.sh
          test "$(find spikes -mindepth 2 -maxdepth 2 -name spike.json | wc -l | tr -d ' ')" = "6"
          node -e 'const p=require("./package.json"); if (!p.engines || p.engines.node !== ">=20") process.exit(1)'
          for manifest in spikes/*/spike.json; do node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if ("decision_record" in m || ![...(m.pass_criteria||[]), ...(m.fail_criteria||[])].every(c => ["PENDING","PASSED","FAILED","NOT_APPLICABLE"].includes(c.status))) process.exit(1)' "$manifest"; done
      - name: Commit clean reviewed result
        run: |
          cat > .github/workflows/runtime-foundation.yml <<'EOF'
          name: Runtime Foundation

          on:
            pull_request:
              branches: [develop]
            push:
              branches: [feat/corte-0-runtime-foundation]

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                - run: npm ci --silent
                - name: Build review artifacts outside the source tree
                  run: node scripts/build-runtime.mjs --out "$RUNNER_TEMP/generated" --bundle-out "$RUNNER_TEMP/shipping-mode.mjs"
                - name: Stage review artifacts
                  if: always()
                  run: |
                    mkdir -p ci-artifacts/runtime/src/generated ci-artifacts/runtime/dist
                    cp "$RUNNER_TEMP/generated/validators.mjs" ci-artifacts/runtime/src/generated/validators.mjs
                    cp "$RUNNER_TEMP/generated/build-meta.mjs" ci-artifacts/runtime/src/generated/build-meta.mjs
                    cp "$RUNNER_TEMP/shipping-mode.mjs" ci-artifacts/runtime/dist/shipping-mode.mjs
                - name: Upload generated runtime for review
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: runtime-foundation-generated
                    path: ci-artifacts
                    if-no-files-found: error
                - run: npm run verify:next-generation
                - name: Prove verification leaves committed artifacts unchanged
                  run: git diff --exit-code -- runtime/src/generated runtime/dist/shipping-mode.mjs
          EOF
          sed -i 's/^          //' .github/workflows/runtime-foundation.yml
          rm -f .github/pr15-review-fix.sh
          git diff --check
          git config user.name "shipping-mode-review-bot"
          git config user.email "shipping-mode-review-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(corte-0): address Plan 1 review findings"
          git push origin HEAD:agent/corte-0-plan-1-project-context-bootstrap
