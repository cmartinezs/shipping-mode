name: Runtime Foundation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery-plan-5-dod-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply PR14 review fixes
        run: python3 .github/pr14-review-fix.py
      - run: npm ci --silent
      - name: Rebuild committed runtime artifacts
        run: |
          npm run build:runtime
          npm run build:test-bundle
      - name: Targeted Plan 5 review tests
        run: |
          node runtime/src/commands/tests/check.test.mjs
          node runtime/tests/discovery-e2e.test.mjs
          node runtime/tests/discovery-real-crash-e2e.test.mjs
      - name: Full next-generation verification
        run: npm run verify:next-generation
      - name: Diff hygiene
        run: git diff --check
      - name: Commit reviewed fixes and restore normal CI
        run: |
          git checkout origin/develop -- .github/workflows/runtime-foundation.yml
          rm -f .github/pr14-review-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close Discovery crash visibility gaps"
          git push origin HEAD:agent/discovery-plan-5-dod-closure
