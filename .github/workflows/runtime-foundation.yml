name: Runtime Foundation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply PR18 review corrections
        run: python3 .github/pr18-review-fix.py
      - name: Install and rebuild
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
      - name: Unit tests
        run: npm run test:unit
      - name: CLI E2E
        run: npm run test:cli-e2e
      - name: Real crash E2E
        run: npm run test:real-crash-e2e
      - name: Security E2E
        run: npm run test:security-e2e
      - name: Bundle tests
        run: npm run test:bundle
      - name: Artifact verification
        run: npm run verify:artifacts
      - name: Full next-generation verification
        run: npm run verify:next-generation
      - name: Diff hygiene
        run: git diff --check
      - name: Commit product corrections to PR branch
        run: |
          git config user.name "shipping-mode-review-bot"
          git config user.email "shipping-mode-review-bot@users.noreply.github.com"
          git add \
            runtime/src/commands/proposalPreparation.mjs \
            runtime/src/lib/changeset.mjs \
            runtime/src/commands/renderers.mjs \
            runtime/src/schemas/scope.schema.json \
            runtime/src/commands/check.mjs \
            runtime/src/commands/tests/guide-lifecycle.test.mjs \
            runtime/src/lib/tests/schema-fixtures.test.mjs \
            docs/superpowers/plans/2026-07-27-corte-1-plan-1-guide-domain-lifecycle.md \
            runtime/src/generated/validators.mjs \
            runtime/src/generated/build-meta.mjs \
            runtime/dist/shipping-mode.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "fix(corte-1): close Plan 1 guide integrity findings"
            git push origin HEAD:agent/corte-1-plan-1-guide-domain
          fi
