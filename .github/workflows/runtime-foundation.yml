name: Runtime Artifact Repair

on:
  push:
    branches: [spike/corte-3-p4-0-host-mcp-bridge]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/corte-3-p4-0-host-mcp-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Regenerate canonical runtime artifacts
        run: node scripts/build-runtime.mjs
      - name: Restore official workflow and publish generated artifacts
        run: |
          git fetch origin develop
          git show origin/develop:.github/workflows/runtime-foundation.yml > .github/workflows/runtime-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/runtime-foundation.yml runtime/src/generated runtime/dist/shipping-mode.mjs
          git diff --cached --quiet && exit 0
          git commit -m "build: regenerate runtime artifacts"
          git push origin HEAD:spike/corte-3-p4-0-host-mcp-bridge
