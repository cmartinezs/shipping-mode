name: Runtime Foundation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/corte-3-plan-1-release-item-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-3-plan-1-release-item-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Extract and apply review patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr24-review-corrections.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/pr24-review-patch.py').write_text(script)
          PY
          python3 /tmp/pr24-review-patch.py
          rm -f .github/pr24-review.trigger .github/workflows/pr24-review-corrections.yml
          git checkout origin/develop -- .github/workflows/runtime-foundation.yml
      - name: Publish source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(item): close Release Item trust and check contracts"
          git push origin HEAD:agent/corte-3-plan-1-release-item-core
      - name: Build and verify
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Publish generated artifacts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate reviewed Corte 3 artifacts"
            git push origin HEAD:agent/corte-3-plan-1-release-item-core
          fi
