name: Runtime Foundation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/corte-3-plan-1-release-item-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-3-plan-1-release-item-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Repair multiline JavaScript fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('runtime/src/commands/tests/release-item-commands.test.mjs')
          lines = path.read_text().splitlines()
          output = []
          repaired = False
          index = 0
          while index < len(lines):
              if lines[index].startswith('  fs.appendFileSync(itemReadmePath, "drift'):
                  if index + 1 >= len(lines) or lines[index + 1].strip() != '");':
                      raise SystemExit('unexpected broken fixture shape')
                  output.append('  fs.appendFileSync(itemReadmePath, "drift\\n");')
                  index += 2
                  repaired = True
                  continue
              output.append(lines[index])
              index += 1
          if not repaired:
              raise SystemExit('broken fixture was not found')
          path.write_text('\n'.join(output) + '\n')
          PY
          git checkout origin/develop -- .github/workflows/runtime-foundation.yml
      - name: Publish fixture correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(item): repair projection drift literal"
          git push origin HEAD:agent/corte-3-plan-1-release-item-core
      - name: Build and verify
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Publish generated artifacts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate reviewed Corte 3 artifacts"
            git push origin HEAD:agent/corte-3-plan-1-release-item-core
          fi
