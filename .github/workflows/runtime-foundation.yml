name: Runtime Foundation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [feat/corte-0-runtime-foundation]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/discovery-plan-4-autonomy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply PR13 review fixes
        run: |
          python3 scripts/pr13-review-fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('runtime/src/schemas/operation.schema.json')
          text = p.read_text()
          old = '      "then": { "required": ["autonomyEvaluation"] }\n'
          new = '      "then": {\n        "required": ["autonomyEvaluation"],\n        "properties": { "autonomyEvaluation": { "$ref": "#/properties/autonomyEvaluation" } }\n      }\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one strict-required patch target, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci --silent
      - name: Rebuild committed artifacts
        run: |
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
      - name: Targeted review tests
        run: |
          node runtime/src/lib/tests/autonomy.test.mjs
          node runtime/src/commands/tests/autonomy-approve.test.mjs
          node runtime/src/lib/tests/schema-fixtures.test.mjs
          node runtime/src/tests/dispatcher.test.mjs
      - run: npm run verify:next-generation
      - name: Prove generated artifacts are current
        run: npm run verify:artifacts
      - name: Commit reviewed fixes and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/develop -- .github/workflows/runtime-foundation.yml
          git rm -f .github/workflows/pr13-review-fixes.yml scripts/pr13-review-fixes.py
          rm -f pr13-build.log scripts/pr13-build-error.log
          git add docs runtime .github/workflows/runtime-foundation.yml scripts
          git diff --cached --check
          git commit -m "fix Plan 4 autonomy trust boundary"
          git push origin HEAD:agent/discovery-plan-4-autonomy
