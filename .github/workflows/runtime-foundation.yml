name: PR19 Helper Cleanup

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove temporary review helpers
        run: |
          rm -f .github/pr19-review-fix.py .github/pr19-review-fix-2.py .github/pr19-review-fix-3.py .github/pr19-review-fix-4.py .github/pr19-review-fix-5.py .github/pr19-review-fix-6.py .github/pr19-review-fix-7.py .github/pr19-review-fix-8.py
      - name: Commit helper cleanup
        run: |
          git config user.name "shipping-mode-review-bot"
          git config user.email "shipping-mode-review-bot@users.noreply.github.com"
          git add -A .github/pr19-review-fix.py .github/pr19-review-fix-2.py .github/pr19-review-fix-3.py .github/pr19-review-fix-4.py .github/pr19-review-fix-5.py .github/pr19-review-fix-6.py .github/pr19-review-fix-7.py .github/pr19-review-fix-8.py
          git diff --cached --check
          git commit -m "chore: remove PR19 review helpers"
          git push origin HEAD:agent/corte-1-plan-2-generation-dsl-projections
