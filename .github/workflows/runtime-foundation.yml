name: Runtime Foundation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Materialize verified review corrections
        run: |
          sed -n '1,/^PY$/p' .github/pr15-review-fix.sh | bash
          python3 - <<'PY'
          from pathlib import Path
          p = Path('spikes/host-integration/tests/host-integration.test.mjs')
          text = p.read_text()
          old = '  "init --name <name> [--base-branch <b>] [--vcs git|none] --actor <actor>",'
          new = '  "init --name <name> [--project-type software|non_software|mixed|unknown] [--base-branch <b>] [--vcs git|none] --actor <actor>",'
          if text.count(old) != 1:
              raise SystemExit(f'expected one host-integration help entry, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run verify:artifacts
      - name: Export changed product files
        run: |
          mkdir -p /tmp/pr15-output
          for f in \
            bin/shipping-mode.mjs \
            runtime/src/commands/renderers.mjs \
            runtime/src/commands/init.mjs \
            runtime/src/index.mjs \
            runtime/src/commands/check.mjs \
            runtime/src/schemas/config.schema.json \
            runtime/src/schemas/change-set.schema.json \
            runtime/src/schemas/operation.schema.json \
            runtime/src/schemas/result.schema.json \
            runtime/src/commands/tests/renderers.test.mjs \
            runtime/src/commands/tests/check.test.mjs \
            runtime/src/lib/tests/schema.test.mjs \
            runtime/src/lib/tests/schema-fixtures.test.mjs \
            runtime/src/generated/validators.mjs \
            runtime/dist/shipping-mode.mjs \
            docs/superpowers/plans/2026-07-27-corte-0-completion-plan-1-project-context-bootstrap.md \
            spikes/host-integration/tests/host-integration.test.mjs; do
            mkdir -p "/tmp/pr15-output/$(dirname "$f")"
            cp "$f" "/tmp/pr15-output/$f"
          done
          tar -C /tmp/pr15-output -czf /tmp/pr15-reviewed-output.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: pr15-reviewed-output
          path: /tmp/pr15-reviewed-output.tar.gz
          if-no-files-found: error
