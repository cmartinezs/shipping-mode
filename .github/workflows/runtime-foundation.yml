name: Runtime Foundation

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply PR19 review corrections
        run: |
          python3 .github/pr19-review-fix.py
          python3 .github/pr19-review-fix-2.py
          python3 .github/pr19-review-fix-3.py
          python3 .github/pr19-review-fix-4.py
          python3 .github/pr19-review-fix-5.py
          python3 .github/pr19-review-fix-6.py
          python3 .github/pr19-review-fix-7.py
      - run: npm ci --silent
      - name: Build schemas
        run: npm run build:schemas
      - name: Build runtime
        run: npm run build:runtime
      - name: Build test bundle
        run: npm run build:test-bundle
      - name: Unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee /tmp/unit-tests.log
      - name: Upload unit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr19-unit-diagnostics
          path: /tmp/unit-tests.log
          if-no-files-found: warn
      - name: CLI E2E
        run: npm run test:cli-e2e
      - name: Real crash E2E
        run: npm run test:real-crash-e2e
      - name: Security E2E
        run: npm run test:security-e2e
      - name: Bundle tests
        run: npm run test:bundle
      - name: Artifact verification
        run: npm run verify:artifacts
      - name: Full next-generation verification
        run: npm run verify:next-generation
      - name: Diff hygiene
        run: git diff --check
      - name: Commit product corrections to PR branch
        run: |
          git config user.name "shipping-mode-review-bot"
          git config user.email "shipping-mode-review-bot@users.noreply.github.com"
          git add \
            bin/shipping-mode.mjs \
            docs/superpowers/plans/2026-07-28-corte-1-plan-2-generation-projections-generators.md \
            runtime/src/commands/changesetCommand.mjs \
            runtime/src/commands/proposalPreparation.mjs \
            runtime/src/commands/renderers.mjs \
            runtime/src/commands/tests/guide-lifecycle.test.mjs \
            runtime/src/commands/tests/scope-generator-set.test.mjs \
            runtime/src/lib/changeset.mjs \
            runtime/src/lib/customGuideGenerator.mjs \
            runtime/src/lib/guideEvaluator.mjs \
            runtime/src/lib/guideGeneration.mjs \
            runtime/src/lib/tests/custom-guide-generator.test.mjs \
            runtime/src/lib/tests/guide-evaluator.test.mjs \
            runtime/src/lib/tests/guide-generation.test.mjs \
            runtime/src/lib/tests/schema-fixtures.test.mjs \
            runtime/src/schemas/change-set.schema.json \
            runtime/src/schemas/guide.schema.json \
            runtime/src/schemas/operation.schema.json \
            runtime/src/schemas/scope.schema.json \
            runtime/src/schemas/tests/schemas-are-valid-json.test.mjs \
            runtime/src/generated/validators.mjs \
            runtime/src/generated/build-meta.mjs \
            runtime/dist/shipping-mode.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "fix(corte-1): close Plan 2 trust-boundary findings"
            git push origin HEAD:agent/corte-1-plan-2-generation-dsl-projections
          fi
