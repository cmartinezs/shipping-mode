name: Runtime Artifact Repair

on:
  pull_request:
    branches: [develop]
    types: [reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 28 && github.event.pull_request.head.ref == 'spike/corte-3-p4-0-host-mcp-bridge' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/corte-3-p4-0-host-mcp-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Regenerate canonical runtime artifacts
        run: npm run build:runtime
      - name: Restore official workflow and publish generated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin develop --depth=1
          git checkout origin/develop -- .github/workflows/runtime-foundation.yml
          git add .github/workflows/runtime-foundation.yml runtime/src/generated/validators.mjs runtime/src/generated/build-meta.mjs runtime/dist/shipping-mode.mjs
          if git diff --cached --quiet; then
            echo "No generated artifact changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(runtime): regenerate spike review artifacts"
          git push origin HEAD:spike/corte-3-p4-0-host-mcp-bridge
