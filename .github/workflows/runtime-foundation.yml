name: PR20 Review Corrections

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'agent/corte-1-plan-3-staleness-strict-check-guides'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-1-plan-3-staleness-strict-check-guides
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply PR20 review corrections
        run: bash .github/pr20-review-fix.sh
      - run: npm ci --silent
      - run: npm run build:schemas
      - run: npm run build:runtime
      - run: npm run build:test-bundle
      - run: npm run test:unit
      - run: npm run test:cli-e2e
      - run: npm run test:real-crash-e2e
      - run: npm run test:security-e2e
      - run: npm run test:bundle
      - run: npm run verify:artifacts
      - run: npm run verify:next-generation
      - run: git diff --check
      - name: Commit product corrections to PR branch
        run: |
          git config user.name "shipping-mode-review-bot"
          git config user.email "shipping-mode-review-bot@users.noreply.github.com"
          git add bin docs runtime spikes
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix(guides): close Plan 3 health trust gaps"
          git push origin HEAD:agent/corte-1-plan-3-staleness-strict-check-guides
