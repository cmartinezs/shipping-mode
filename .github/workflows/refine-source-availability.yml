name: Refine source availability semantics

on:
  push:
    branches:
      - agent/host-knowledge-model

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-knowledge-model
          fetch-depth: 0

      - name: Clarify mixed source availability
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p4 = Path('docs/plugin-redesign-release-flow/04-release-init-configuracion.md')
          t4 = p4.read_text()
          t4 = t4.replace('''  availability: implemented\n  generated: false''', '''  availability: mixed\n  generated: false''', 1)
          t4 = t4.replace('''implemented\npartial\nplanned\ndeprecated\nhistorical\n```\n\nLa configuracion''', '''implemented\npartial\nplanned\ndeprecated\nhistorical\nmixed\nunknown\n```\n\n`availability` describe el estado del contenido que la fuente afirma cuando ese estado puede resolverse de forma util. Puede ser `mixed` cuando un mismo documento combina estado actual y futuro, `unknown` cuando discovery no puede inferirlo con seguridad, y puede refinarse a nivel de claim/regla cuando una clasificacion por archivo sea demasiado gruesa.\n\nLa configuracion''', 1)
          p4.write_text(t4)

          p5 = Path('docs/plugin-redesign-release-flow/05-scope-task-guides.md')
          t5 = p5.read_text()
          t5 = t5.replace('''availability (`implemented`, `partial`, `planned`, `deprecated`, `historical`);''', '''availability (`implemented`, `partial`, `planned`, `deprecated`, `historical`, `mixed`, `unknown`);''', 1)
          p5.write_text(t5)
          PY

          rm -f .github/workflows/refine-source-availability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: clarify source availability semantics"
          git push origin HEAD:agent/host-knowledge-model
