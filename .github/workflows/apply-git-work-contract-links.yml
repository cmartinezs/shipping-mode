name: Apply Git work contract links

on:
  push:
    branches:
      - agent/git-work-execution-contract

permissions:
  contents: write

jobs:
  patch-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/git-work-execution-contract
          fetch-depth: 0

      - name: Integrate Git contract into canonical design docs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          patch('docs/plugin-redesign-release-flow/02-mapa-comandos-skills.md',
            '''| `plan-smoke-config`, `plan-git-config` | `/<product-name>:config` con stages `commands`, `git`, `policies` | Borrar config commands sueltos. | Configuracion pertenece al Project Context. |''',
            '''| `plan-smoke-config`, `plan-git-config` | `/<product-name>:config` con stages `commands`, `git`, `policies` | Borrar config commands sueltos. | Configuracion pertenece al Project Context; la mecanica Git vive en el runtime y la estrategia concreta se resuelve desde la Git policy del host. Ver [Git work execution contract](11-git-work-execution-contract.md). |''', '02 legacy git config mapping')

          patch('docs/plugin-redesign-release-flow/02-mapa-comandos-skills.md',
            '''- pasos Git repetidos;\n- tablas duplicadas;''',
            '''- pasos Git repetidos o recetas de branching hardcodeadas; las skills delegan en el Git engine + policy evaluator descritos en [Git work execution contract](11-git-work-execution-contract.md);\n- tablas duplicadas;''', '02 skill git rule')

          patch('docs/plugin-redesign-release-flow/02-mapa-comandos-skills.md',
            '''  command-policy.mjs  # comandos estructurados, allowlist, approvals\n  event-journal.mjs   # eventos JSON inmutables bajo .planning/events/\n  change-set.mjs      # inspect/propose/...''',
            '''  command-policy.mjs  # comandos estructurados, allowlist, approvals\n  git-engine.mjs      # operaciones Git query/mutantes agnosticas, branches/worktrees/commits/evidence\n  git-policy.mjs      # resuelve Project Context + scope refinements + approvals sin hardcodear GitFlow\n  event-journal.mjs   # eventos JSON inmutables bajo .planning/events/\n  change-set.mjs      # inspect/propose/...''', '02 runtime git libraries')

          patch('docs/plugin-redesign-release-flow/03-plan-incremental.md',
            '''- Detectar y confirmar si el proyecto usa git.\n- Si usa git, configurar branch base, estrategia de ramas, lanes y si se permitira automatizacion `git`/`gh`.''',
            '''- Detectar y confirmar si el proyecto usa git.\n- Si usa git, resolver el [Git work execution contract](11-git-work-execution-contract.md): Project Context conserva branch de trabajo/base, integracion, produccion/promocion, estrategia de ramas/worktrees, PR targets, merge policy y autonomia; Shipping Mode conserva la mecanica Git segura y no impone GitFlow fijo.\n- Registrar provenance de la Git policy hacia fuentes host como CONTRIBUTING/AGENTS/CLAUDE/developer guides/CI/CODEOWNERS/provider metadata y marcar conflictos como gap/decision antes de permitir automatizacion Git mutante.''', '03 Corte 0 Git policy')

          patch('docs/plugin-redesign-release-flow/03-plan-incremental.md',
            '''- Ejecutar todo cambio via ChangeSet con `baseRevisions` e idempotency key.\n- Guardar comandos ejecutados como estructura y eventos observables.\n- Agregar rollback tecnico o compensacion cuando una operacion falla despues de escribir.''',
            '''- Ejecutar todo cambio via ChangeSet con `baseRevisions` e idempotency key.\n- Resolver `task inspect/start/verify/closeout` contra Git engine + Project Context Git policy + refinamientos compatibles de la scope guide; branch/worktree/commit/PR no son estados de dominio de la task sino contexto/evidencia del lifecycle.\n- Soportar, sin imponer una, estrategias como branch por task, branch/worktree por work package, branch compartida o trunk-based segun policy host.\n- Registrar branch, worktree, base commit, commits, push y PR/MR como evidencia estructurada; diferenciar integracion de trabajo de promocion estable/productiva.\n- Guardar comandos ejecutados como estructura y eventos observables.\n- Agregar rollback tecnico o compensacion cuando una operacion falla despues de escribir, incluyendo fallas entre commit, push y apertura/actualizacion de PR.''', '03 Corte 4 Git execution')

          patch('docs/plugin-redesign-release-flow/04-release-init-configuracion.md',
            '''git:\n  enabled: true\n  base_branch: main\n  provider: github\n  automation: assisted''',
            '''git:\n  enabled: true\n  provider: github\n  branches:\n    work_base: develop\n    integration: develop\n    production: master\n  work:\n    branch_unit: work_package\n    branch_pattern: "<type>/<slug>"\n  worktrees:\n    mode: optional\n    unit: work_package\n  commits:\n    granularity: task\n  pull_requests:\n    enabled: true\n    work_target: develop\n    draft_by_default: true\n    merge_strategy: host_default\n    promotion:\n      source: develop\n      target: master\n  automation:\n    create_branch: allowed\n    create_worktree: allowed\n    commit: allowed\n    push: approval_required\n    create_pr: approval_required\n    merge_pr: approval_required''', '04 Git config example')

          patch('docs/plugin-redesign-release-flow/04-release-init-configuracion.md',
            '''`execution-contexts/` describe donde se ejecutan validaciones (`local`, `ci`, `container`, `preview`). `environments/` describe targets desplegables (`beta`, `demo`, `staging`, `production`). No mezclar `ci` con un ambiente desplegable.''',
            '''La seccion `git` representa policy del repositorio anfitrion, no un GitFlow universal. Los nombres del ejemplo ilustran que branch por defecto, branch de trabajo, integracion y produccion pueden ser distintas. La mecanica, guardrails, worktrees, evidencia y lifecycle de operaciones Git pertenecen a Shipping Mode y se definen en [Git work execution contract](11-git-work-execution-contract.md).\n\n`execution-contexts/` describe donde se ejecutan validaciones (`local`, `ci`, `container`, `preview`). `environments/` describe targets desplegables (`beta`, `demo`, `staging`, `production`). No mezclar `ci` con un ambiente desplegable.''', '04 Git contract explanation')

          patch('docs/plugin-redesign-release-flow/05-scope-task-guides.md',
            '''automation:\n  generator: scripts/planning/web-task-guide.mjs\n  input_schema: scope-guide-input-v1\n  fallback: mark-gaps\nopen_gaps: []''',
            '''automation:\n  generator: scripts/planning/web-task-guide.mjs\n  input_schema: scope-guide-input-v1\n  fallback: mark-gaps\ngit_workflow:\n  branch_unit: work_package\n  commit_granularity: task\n  require_clean_start: true\n  open_pr_after:\n    - work_package_verified\n  required_gates_before_push:\n    - build\n    - unit-tests\nopen_gaps: []''', '05 task guide Git refinements')

          patch('docs/plugin-redesign-release-flow/05-scope-task-guides.md',
            '''- si codigo/config/CI contradice una afirmacion de estado implementado, registrar drift; no asumir que el documento ni el codigo resuelven por si solos la intencion.\n\nEl runtime guarda `Source Index` con metadata y fingerprints para detectar staleness.''',
            '''- si codigo/config/CI contradice una afirmacion de estado implementado, registrar drift; no asumir que el documento ni el codigo resuelven por si solos la intencion.\n- las reglas Git de scope solo refinan la Project Context Git policy; no pueden cambiar branch productiva/integracion, PR targets, branch protection, approvals ni promotion flow. Ver [Git work execution contract](11-git-work-execution-contract.md).\n\nEl runtime guarda `Source Index` con metadata y fingerprints para detectar staleness.''', '05 Git authority rule')
          PY

          rm -f .github/workflows/apply-git-work-contract-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate Git work contract across design docs"
          git push origin HEAD:agent/git-work-execution-contract
