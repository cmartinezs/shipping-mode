name: PR30 Review Repair

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Synchronize branch with develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
      - run: npm ci --silent
      - name: Regenerate canonical artifacts
        run: |
          npm run build:schemas
          npm run build:runtime
      - name: Publish synchronized review branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git rm -f .github/workflows/pr30-review-repair.yml
          if test -f .github/workflows/pr30-sync.yml; then git rm -f .github/workflows/pr30-sync.yml; fi
          git add runtime/src/generated runtime/dist bin/shipping-mode.mjs
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore(branch): sync PR 30 review corrections"
          else
            git commit -m "build(runtime): sync PR 30 review corrections"
          fi
          git push origin "HEAD:${HEAD_REF}"
