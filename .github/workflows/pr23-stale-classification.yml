name: PR23 Stale Classification Fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.ref == 'agent/corte-2-plan-3-derived-health-closure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-2-plan-3-derived-health-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Correct finalization stale classification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('runtime/src/lib/releaseMutations.mjs')
          text = path.read_text()
          old_import = 'import { assertReleaseCanFinalize, evaluateReleaseHealth } from "./releaseHealth.mjs";'
          new_import = 'import { assertReleaseCanFinalize, evaluateReleaseHealth, releaseFinalizationGuardSummary } from "./releaseHealth.mjs";'
          if old_import not in text:
              raise SystemExit('releaseHealth import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old_guard = '    const guardSummary = assertReleaseCanFinalize({ health, release });'
          new_guard = '    const currentGuardSummary = releaseFinalizationGuardSummary(health, release);'
          if old_guard not in text:
              raise SystemExit('finalization guard anchor not found')
          text = text.replace(old_guard, new_guard, 1)
          old_hash = '    const guardHash = releasePolicyRequestHash({ actor: "system:release-health", requestSnapshot: guardSummary });'
          new_hash = '    const guardHash = releasePolicyRequestHash({ actor: "system:release-health", requestSnapshot: currentGuardSummary });'
          if old_hash not in text:
              raise SystemExit('finalization guard hash anchor not found')
          text = text.replace(old_hash, new_hash, 1)
          marker = '    if (revisionHash(release.finalization) !== revisionHash(payload.previousFinalization)) {'
          if marker not in text:
              raise SystemExit('finalization revision anchor not found')
          text = text.replace(marker, '    assertReleaseCanFinalize({ health, release });\n' + marker, 1)
          path.write_text(text)
          PY
          rm -f .github/pr23-stale.trigger .github/workflows/pr23-stale-classification.yml
      - name: Publish source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): classify external guard drift as stale"
          git push origin HEAD:agent/corte-2-plan-3-derived-health-closure
      - name: Build and verify
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Publish generated artifacts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate reviewed Corte 2 artifacts"
            git push origin HEAD:agent/corte-2-plan-3-derived-health-closure
          fi
