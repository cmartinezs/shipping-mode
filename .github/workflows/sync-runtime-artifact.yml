name: Sync Runtime Artifact

on:
  push:
    branches: [feat/corte-0-runtime-foundation]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/corte-0-runtime-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - run: npm run --silent build:runtime
      - name: Commit deterministic runtime artifact
        run: |
          if git diff --quiet -- runtime/src/generated runtime/dist/shipping-mode.mjs; then
            echo "Runtime artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/src/generated runtime/dist/shipping-mode.mjs
          git commit -m "build(runtime): refresh deterministic bundle"
          git push origin HEAD:feat/corte-0-runtime-foundation
