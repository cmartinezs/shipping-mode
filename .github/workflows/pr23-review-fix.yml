name: PR23 Review Fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.ref == 'agent/corte-2-plan-3-derived-health-closure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-2-plan-3-derived-health-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply reviewed corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/pr23-review-fix.py')
          text = p.read_text()
          text = text.replace(
              '    end = text.find(end_marker, start)\n    if end < 0:',
              '    end = len(text) if end_marker == "" else text.find(end_marker, start)\n    if end < 0:'
          )
          text = text.replace(
              '    "\\n}",\n    \'\'\'export function assertReleaseCanFinalize',
              '    "",\n    \'\'\'export function assertReleaseCanFinalize'
          )
          text = text.replace(
              "replace_once(commands_test, 'import { revisionHash } from \"../../lib/canonical.mjs\";\\n', 'import { contentHash, revisionHash } from \"../../lib/canonical.mjs\";\\n')",
              "replace_once(commands_test, 'import { parseYaml, stringifyYaml } from \"../../lib/yaml.mjs\";\\n', 'import { parseYaml, stringifyYaml } from \"../../lib/yaml.mjs\";\\nimport { contentHash, revisionHash } from \"../../lib/canonical.mjs\";\\n')"
          )
          p.write_text(text)
          PY
          python3 .github/pr23-review-fix.py
          rm -f .github/pr23-review-fix.py .github/workflows/pr23-review-fix.yml
      - name: Publish source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): close Corte 2 health and finalization gaps"
          git push origin HEAD:agent/corte-2-plan-3-derived-health-closure
      - name: Build and verify
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Publish generated artifacts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate reviewed Corte 2 artifacts"
            git push origin HEAD:agent/corte-2-plan-3-derived-health-closure
          fi
