name: PR22 Observable Runner

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-2-plan-2-release-policy-operational-refs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Extract and apply reviewed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr22-review-fix.yml').read_text().splitlines()
          start_marker = '      - name: Apply review corrections'
          end_marker = '      - name: Install and regenerate artifacts'
          start = source.index(start_marker)
          end = source.index(end_marker)
          run_line = next(i for i in range(start, end) if source[i].strip() == 'run: |')
          body = []
          for line in source[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/pr22-apply.sh').write_text('\n'.join(body) + '\n')
          PY
          bash -euxo pipefail /tmp/pr22-apply.sh
          rm -f .github/workflows/pr22-review-fix.yml .github/workflows/pr22-runner.yml
      - name: Publish source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): close Plan 2 trust boundaries"
          git push origin HEAD:agent/corte-2-plan-2-release-policy-operational-refs
      - name: Regenerate and verify
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Publish generated artifacts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate Plan 2 review artifacts"
            git push origin HEAD:agent/corte-2-plan-2-release-policy-operational-refs
          fi
