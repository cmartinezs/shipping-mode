name: Finalize plan integrity tests

on:
  push:
    branches:
      - agent/fix-corte0-plan-integrity

permissions:
  contents: write

jobs:
  patch-plan-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-corte0-plan-integrity
          fetch-depth: 0

      - name: Complete regression cases in canonical plan
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          plan = Path('docs/plans/corte-0-runtime-foundation-implementation.md')
          text = plan.read_text()

          recovery_needle = '  assert.equal(fs.readFileSync(path.join(planningRoot, first.target), "utf8"), "not what recovery expects\\n");\n'
          if text.count(recovery_needle) != 1:
              raise SystemExit(f'recovery insertion point count={text.count(recovery_needle)}')
          recovery_extra = '''
            // The persisted conflict must remain globally blocking on every later
            // mutation, not just in the recovery sweep that first discovered it.
            const dirsBeforeBlockedAttempts = fs.readdirSync(operationsRoot).sort();
            for (const attemptedName of ["blocked-first", "blocked-second"]) {
              assert.throws(
                () => propose({
                  operationsRoot, planningRoot, kind: "config.update", target: {},
                  payload: { name: attemptedName }, targetFiles: ["config.yml"], actor: "carlos"
                }),
                RecoveryRequiredError,
                "a persisted RECOVERY_REQUIRED operation must block every subsequent mutation"
              );
            }
            assert.deepEqual(fs.readdirSync(operationsRoot).sort(), dirsBeforeBlockedAttempts, "blocked mutation attempts must not create new operations");
            assert.equal(readOperation(operationsRoot, operationId).status, "RECOVERY_REQUIRED", "the conflict remains blocking until manually resolved");
          '''
          text = text.replace(recovery_needle, recovery_needle + recovery_extra, 1)

          event_needle = '    assert.equal(finalOperation.expectedEvents[0].document.idempotencyKey, persistedManifest.document.idempotencyKey);\n'
          if text.count(event_needle) != 1:
              raise SystemExit(f'event insertion point count={text.count(event_needle)}')
          event_extra = '''    const eventPath = path.join(planningRoot, "events", finalOperation.expectedEvents[0].relativePath);
              const eventFiles = fs.readdirSync(path.dirname(eventPath)).filter((name) => name.endsWith(".json"));
              assert.equal(eventFiles.length, 1, "AFTER_MANIFEST: retry must result in exactly one event file, never a regenerated duplicate");
          '''
          text = text.replace(event_needle, event_needle + event_extra, 1)

          plan.write_text(text)
          PY

          rm -f .github/workflows/finalize-plan-integrity-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete final plan integrity regression cases"
          git push origin HEAD:agent/fix-corte0-plan-integrity
