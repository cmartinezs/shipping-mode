name: PR30 Branch Sync

on:
  push:
    branches:
      - agent/corte-3-plan-4-external-provider-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/corte-3-plan-4-external-provider-closure
      - name: Merge develop and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-edit origin/develop
          git rm .github/workflows/pr30-sync.yml
          git commit -m "chore(branch): sync PR 30 with develop"
          git push origin HEAD:agent/corte-3-plan-4-external-provider-closure
