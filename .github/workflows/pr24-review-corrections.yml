name: PR24 Review Corrections

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.ref == 'agent/corte-3-plan-1-release-item-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-3-plan-1-release-item-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply adversarial review corrections
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1))

          # Bind idempotency to the canonical parent Release.
          path = Path('runtime/src/lib/releaseItemCreate.mjs')
          text = path.read_text()
          text = text.replace(
              'export function releaseItemCreateRequestHash({ actor, requestSnapshot }) {\n  return revisionHash({ actor, ...requestSnapshot });\n}',
              'export function releaseItemCreateRequestHash({ actor, releaseId, requestSnapshot }) {\n  if (!isUuidV7(releaseId)) throw new Error(`invalid Release Item parent release id: ${releaseId}`);\n  return revisionHash({ actor, releaseId, ...requestSnapshot });\n}'
          )
          text = text.replace(
              'export function normalizeReleaseItemCreateRequest(rawPayload, { actor, defaultIdempotencyKey }) {',
              'export function normalizeReleaseItemCreateRequest(rawPayload, { actor, defaultIdempotencyKey, releaseId }) {'
          )
          text = text.replace(
              '  return { requestSnapshot, idempotencyKey, idempotencyRequestHash: releaseItemCreateRequestHash({ actor, requestSnapshot }) };',
              '  return { requestSnapshot, idempotencyKey, idempotencyRequestHash: releaseItemCreateRequestHash({ actor, releaseId, requestSnapshot }) };'
          )
          text = text.replace(
              '  itemRequest = null,\n  itemId = null\n}) {\n  const normalized = itemRequest ?? normalizeReleaseItemCreateRequest(rawPayload, { actor, defaultIdempotencyKey: operationId });\n  const resolution = resolveReleaseReference(planningRoot, releaseRef);',
              '  itemRequest = null,\n  itemId = null,\n  expectedReleaseId = null\n}) {\n  const resolution = resolveReleaseReference(planningRoot, releaseRef);'
          )
          text = text.replace(
              '  const release = resolution.release;\n  assertReleaseParentCanAcceptItem(release);',
              '  const release = resolution.release;\n  if (expectedReleaseId && release.id !== expectedReleaseId) {\n    const error = new Error(`REFERENCE_STALE: Release reference resolved to ${release.id}, expected ${expectedReleaseId}`);\n    error.code = "STALE";\n    throw error;\n  }\n  const normalized = itemRequest ?? normalizeReleaseItemCreateRequest(rawPayload, { actor, defaultIdempotencyKey: operationId, releaseId: release.id });\n  const expectedRequestHash = releaseItemCreateRequestHash({ actor, releaseId: release.id, requestSnapshot: normalized.requestSnapshot });\n  if (normalized.idempotencyRequestHash !== expectedRequestHash) throw new Error("release-item.create request binding does not match the canonical parent Release");\n  assertReleaseParentCanAcceptItem(release);'
          )
          text = text.replace(
              '    const expectedHash = releaseItemCreateRequestHash({ actor: payload.actor, requestSnapshot: payload.requestSnapshot });',
              '    const expectedHash = releaseItemCreateRequestHash({ actor: payload.actor, releaseId: payload.releaseId, requestSnapshot: payload.requestSnapshot });'
          )

          # Reject unknown source-ref fields and enforce provider-specific locator/revision unions.
          old_source = '''function normalizeSourceRefs(value) {
  if (value === undefined || value === null) return [];
  if (!Array.isArray(value)) throw new Error("sourceRefs must be an array");
  return value.map((ref, index) => {
    if (ref === null || typeof ref !== "object" || Array.isArray(ref)) throw new Error(`sourceRefs[${index}] must be an object`);
    const provider = requireString(ref.provider, `sourceRefs[${index}].provider`);
    if (!["local_repository", "jira", "github_issues", "azure_boards", "linear", "custom"].includes(provider)) throw new Error(`sourceRefs[${index}].provider is invalid`);
    const role = requireString(ref.role, `sourceRefs[${index}].role`);
    if (!["primary", "supporting", "derived_from", "supersedes", "related"].includes(role)) throw new Error(`sourceRefs[${index}].role is invalid`);
    const normalized = {
      sourceId: requireString(ref.sourceId, `sourceRefs[${index}].sourceId`),
      provider,
      role,
      mappingVersion: Number(ref.mappingVersion)
    };
    if (!Number.isInteger(normalized.mappingVersion) || normalized.mappingVersion < 1) throw new Error(`sourceRefs[${index}].mappingVersion must be a positive integer`);
    for (const field of ["externalId", "externalUrl", "externalRevision", "path", "contentRevision", "fingerprint", "importedAt"]) {
      if (ref[field] !== undefined && ref[field] !== null && ref[field] !== "") normalized[field] = requireString(ref[field], `sourceRefs[${index}].${field}`);
    }
    if (!normalized.externalId && !normalized.path) throw new Error(`sourceRefs[${index}] requires externalId or path`);
    return normalized;
  }).sort((left, right) => `${left.role}:${left.provider}:${left.sourceId}:${left.externalId || left.path}`.localeCompare(`${right.role}:${right.provider}:${right.sourceId}:${right.externalId || right.path}`));
}'''
          new_source = '''function normalizeSourceRefs(value) {
  if (value === undefined || value === null) return [];
  if (!Array.isArray(value)) throw new Error("sourceRefs must be an array");
  const allowedFields = new Set(["sourceId", "provider", "role", "mappingVersion", "externalId", "externalUrl", "externalRevision", "path", "contentRevision", "fingerprint"]);
  const normalizedRefs = value.map((ref, index) => {
    if (ref === null || typeof ref !== "object" || Array.isArray(ref)) throw new Error(`sourceRefs[${index}] must be an object`);
    for (const field of Object.keys(ref)) {
      if (field === "importedAt") throw new Error(`sourceRefs[${index}].importedAt is server-owned`);
      if (!allowedFields.has(field)) throw new Error(`sourceRefs[${index}] contains unsupported field: ${field}`);
    }
    const provider = requireString(ref.provider, `sourceRefs[${index}].provider`);
    if (!["local_repository", "jira", "github_issues", "azure_boards", "linear", "custom"].includes(provider)) throw new Error(`sourceRefs[${index}].provider is invalid`);
    const role = requireString(ref.role, `sourceRefs[${index}].role`);
    if (!["primary", "supporting", "derived_from", "supersedes", "related"].includes(role)) throw new Error(`sourceRefs[${index}].role is invalid`);
    const normalized = {
      sourceId: requireString(ref.sourceId, `sourceRefs[${index}].sourceId`),
      provider,
      role,
      mappingVersion: Number(ref.mappingVersion)
    };
    if (!Number.isInteger(normalized.mappingVersion) || normalized.mappingVersion < 1) throw new Error(`sourceRefs[${index}].mappingVersion must be a positive integer`);
    for (const field of ["externalId", "externalUrl", "externalRevision", "path", "contentRevision", "fingerprint"]) {
      if (ref[field] !== undefined && ref[field] !== null && ref[field] !== "") normalized[field] = requireString(ref[field], `sourceRefs[${index}].${field}`);
    }
    const localShape = provider === "local_repository" || (provider === "custom" && Boolean(normalized.path));
    if (localShape) {
      if (!normalized.path) throw new Error(`sourceRefs[${index}] local providers require path`);
      if (normalized.externalId || normalized.externalUrl || normalized.externalRevision) throw new Error(`sourceRefs[${index}] local providers cannot use external locator fields`);
      if (!normalized.contentRevision && !normalized.fingerprint) throw new Error(`sourceRefs[${index}] local providers require contentRevision or fingerprint`);
    } else {
      if (!normalized.externalId) throw new Error(`sourceRefs[${index}] external providers require externalId`);
      if (normalized.path || normalized.contentRevision) throw new Error(`sourceRefs[${index}] external providers cannot use local path/contentRevision fields`);
      if (!normalized.externalRevision && !normalized.fingerprint) throw new Error(`sourceRefs[${index}] external providers require externalRevision or fingerprint`);
    }
    return normalized;
  }).sort((left, right) => `${left.role}:${left.provider}:${left.sourceId}:${left.externalId || left.path}`.localeCompare(`${right.role}:${right.provider}:${right.sourceId}:${right.externalId || right.path}`));
  const identities = normalizedRefs.map((ref) => `${ref.role}:${ref.provider}:${ref.sourceId}:${ref.externalId || ref.path}`);
  if (new Set(identities).size !== identities.length) throw new Error("sourceRefs cannot contain duplicate source identities");
  return normalizedRefs;
}'''
          if old_source not in text:
              raise SystemExit('normalizeSourceRefs anchor not found')
          path.write_text(text.replace(old_source, new_source, 1))

          # Resolve the canonical parent before the generic idempotency lookup.
          path = Path('runtime/src/commands/item.mjs')
          text = path.read_text()
          text = text.replace(
              '  const itemRequest = normalizeReleaseItemCreateRequest(rawPayload, { actor, defaultIdempotencyKey: candidateOperationId });\n  const persistedOperationId = propose({',
              '  const releaseResolution = resolveReleaseReference(planningRoot, releaseRef);\n  if (releaseResolution.status !== "FOUND") throw new Error(`release reference failed: ${releaseResolution.status}: ${releaseResolution.findings.join("; ")}`);\n  const canonicalReleaseId = releaseResolution.release.id;\n  const itemRequest = normalizeReleaseItemCreateRequest(rawPayload, { actor, defaultIdempotencyKey: candidateOperationId, releaseId: canonicalReleaseId });\n  const persistedOperationId = propose({'
          )
          text = text.replace(
              '      itemRequest,\n      itemId\n    })',
              '      itemRequest,\n      itemId,\n      expectedReleaseId: canonicalReleaseId\n    })'
          )
          check_fn = '''

export function runCheckItem({ planningRoot, releaseRef, itemRef }) {
  const status = runItemStatus({ planningRoot, releaseRef, itemRef });
  if (status.status !== "FOUND") {
    return { ...status, scope: "single", items: [], pendingOperations: status.pendingOperations || [] };
  }
  const entry = {
    release: status.release,
    item: status.item,
    derivedHealth: status.derivedHealth,
    completion: status.completion,
    readiness: status.readiness,
    findings: status.derivedHealth.findings
  };
  return {
    status: status.derivedHealth.aggregate.valid ? "PASS" : "FAIL",
    scope: "single",
    items: [entry],
    findings: status.derivedHealth.findings.map((finding) => `${finding.code}: ${finding.message}`),
    pendingOperations: []
  };
}
'''
          if 'export function runCheckItem' not in text:
              text += check_fn
          path.write_text(text)

          # Route check item through a real check contract.
          replace_once(
              'runtime/src/index.mjs',
              'import { runItemCreate, runItemStatus } from "./commands/item.mjs";',
              'import { runCheckItem, runItemCreate, runItemStatus } from "./commands/item.mjs";'
          )
          replace_once(
              'runtime/src/index.mjs',
              '      return runItemStatus({ planningRoot, releaseRef: parsed.releaseRef, itemRef: parsed.itemRef });',
              '      return runCheckItem({ planningRoot, releaseRef: parsed.releaseRef, itemRef: parsed.itemRef });'
          )

          # Close source-ref shape and resolution/status consistency in the canonical schema.
          schema_path = Path('runtime/src/schemas/release-item.schema.json')
          schema = json.loads(schema_path.read_text())
          source_ref = schema['$defs']['sourceRef']
          source_ref.pop('anyOf', None)
          external_providers = ['jira', 'github_issues', 'azure_boards', 'linear']
          def forbid(*fields):
              return {'not': {'anyOf': [{'required': [field]} for field in fields]}}
          local_branch = {
              'properties': {'provider': {'const': 'local_repository'}},
              'required': ['provider', 'path'],
              'allOf': [
                  {'anyOf': [{'required': ['contentRevision']}, {'required': ['fingerprint']}]},
                  forbid('externalId', 'externalUrl', 'externalRevision')
              ]
          }
          external_branch = {
              'properties': {'provider': {'enum': external_providers}},
              'required': ['provider', 'externalId'],
              'allOf': [
                  {'anyOf': [{'required': ['externalRevision']}, {'required': ['fingerprint']}]},
                  forbid('path', 'contentRevision')
              ]
          }
          custom_local = {
              'properties': {'provider': {'const': 'custom'}},
              'required': ['provider', 'path'],
              'allOf': [
                  {'anyOf': [{'required': ['contentRevision']}, {'required': ['fingerprint']}]},
                  forbid('externalId', 'externalUrl', 'externalRevision')
              ]
          }
          custom_external = {
              'properties': {'provider': {'const': 'custom'}},
              'required': ['provider', 'externalId'],
              'allOf': [
                  {'anyOf': [{'required': ['externalRevision']}, {'required': ['fingerprint']}]},
                  forbid('path', 'contentRevision')
              ]
          }
          source_ref['oneOf'] = [local_branch, external_branch, custom_local, custom_external]

          status_conditions = [
              {
                  'if': {'properties': {'status': {'const': 'DONE'}}, 'required': ['status']},
                  'then': {'properties': {'resolution': {'properties': {'type': {'const': 'DONE'}, 'replacementId': {'type': 'null'}}, 'required': ['type', 'replacementId']}}}
              },
              {
                  'if': {'properties': {'status': {'const': 'CANCELLED'}}, 'required': ['status']},
                  'then': {'properties': {'resolution': {'properties': {'type': {'const': 'CANCELLED'}, 'replacementId': {'type': 'null'}}, 'required': ['type', 'replacementId']}}}
              },
              {
                  'if': {'properties': {'status': {'const': 'SUPERSEDED'}}, 'required': ['status']},
                  'then': {'properties': {'resolution': {'properties': {'type': {'const': 'SUPERSEDED'}, 'replacementId': {'$ref': '#/$defs/uuid'}}, 'required': ['type', 'replacementId']}}}
              }
          ]
          schema['allOf'][1:1] = status_conditions
          schema_path.write_text(json.dumps(schema, indent=2) + '\n')

          # Validate replacement references at catalog level.
          path = Path('runtime/src/lib/releaseItemStore.mjs')
          text = path.read_text()
          anchor = '''    for (const dep of item.dependencies) {
      if (dep === item.id) findings.push({ code: "RELEASE_ITEM_DEPENDENCY_SELF", severity: "error", itemId: item.id, message: `Release Item ${item.id} cannot depend on itself` });
      const target = byId.get(dep);
      if (!target) findings.push({ code: "RELEASE_ITEM_DEPENDENCY_MISSING", severity: "error", itemId: item.id, message: `Release Item ${item.id} depends on missing item ${dep}` });
      else if (target.releaseId !== item.releaseId) findings.push({ code: "RELEASE_ITEM_DEPENDENCY_CROSS_RELEASE", severity: "error", itemId: item.id, message: `Release Item ${item.id} depends on item ${dep} from another release` });
    }
'''
          replacement = anchor + '''    if (item.status === "SUPERSEDED") {
      const replacementId = item.resolution?.replacementId;
      if (!replacementId) findings.push({ code: "RELEASE_ITEM_REPLACEMENT_MISSING", severity: "error", itemId: item.id, message: `Superseded Release Item ${item.id} requires replacementId` });
      else if (replacementId === item.id) findings.push({ code: "RELEASE_ITEM_REPLACEMENT_SELF", severity: "error", itemId: item.id, message: `Release Item ${item.id} cannot replace itself` });
      else {
        const replacementItem = byId.get(replacementId);
        if (!replacementItem) findings.push({ code: "RELEASE_ITEM_REPLACEMENT_NOT_FOUND", severity: "error", itemId: item.id, message: `Release Item ${item.id} replacement ${replacementId} does not exist` });
        else if (replacementItem.releaseId !== item.releaseId) findings.push({ code: "RELEASE_ITEM_REPLACEMENT_CROSS_RELEASE", severity: "error", itemId: item.id, message: `Release Item ${item.id} replacement ${replacementId} belongs to another Release` });
      }
    } else if (item.resolution?.replacementId) {
      findings.push({ code: "RELEASE_ITEM_REPLACEMENT_UNEXPECTED", severity: "error", itemId: item.id, message: `Release Item ${item.id} status ${item.status} cannot declare replacementId` });
    }
'''
          if anchor not in text:
              raise SystemExit('release item catalog dependency anchor not found')
          path.write_text(text.replace(anchor, replacement, 1))

          # Command tests: check semantics and parent-bound idempotency.
          path = Path('runtime/src/commands/tests/release-item-commands.test.mjs')
          text = path.read_text()
          text = text.replace(
              'import { runItemCreate, runItemStatus } from "../item.mjs";',
              'import { runCheckItem, runItemCreate, runItemStatus } from "../item.mjs";'
          )
          text = text.replace(
              'import { renderReleaseReadme } from "../../lib/releaseProjection.mjs";',
              'import { renderReleaseReadme } from "../../lib/releaseProjection.mjs";\nimport { renderReleaseItemReadme } from "../../lib/releaseItemProjection.mjs";'
          )
          old = '''  const status = runItemStatus({ planningRoot, releaseRef: release.displayId, itemRef: proposal.displayId });
  assert.equal(status.status, "FOUND");
  assert.equal(status.item.id, proposal.itemId);
  assert.equal(status.derivedHealth.completion.status, "unavailable");
  const operationsBefore = fs.readdirSync(path.join(planningRoot, "operations")).length;
  runItemStatus({ planningRoot, releaseRef: release.releaseId, itemRef: proposal.itemId });
  checkSchema({ planningRoot });
  assert.equal(fs.readdirSync(path.join(planningRoot, "operations")).length, operationsBefore, "item status and check schema must be query-only");
'''
          new = '''  const status = runItemStatus({ planningRoot, releaseRef: release.displayId, itemRef: proposal.displayId });
  assert.equal(status.status, "FOUND");
  assert.equal(status.item.id, proposal.itemId);
  assert.equal(status.derivedHealth.completion.status, "unavailable");
  assert.equal(runCheckItem({ planningRoot, releaseRef: release.displayId, itemRef: proposal.displayId }).status, "PASS");
