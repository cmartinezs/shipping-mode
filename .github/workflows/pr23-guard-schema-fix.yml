name: PR23 Guard Schema Fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.ref == 'agent/corte-2-plan-3-derived-health-closure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/corte-2-plan-3-derived-health-closure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Close guardSummary schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('runtime/src/schemas/change-set.schema.json')
          schema = json.loads(path.read_text())
          guard = schema['$defs']['releaseFinalizationCompletePayload']['properties']['guardSummary']
          required = guard['required']
          for field in ['unavailableCurrentDimensions', 'healthRevision']:
              if field not in required:
                  required.append(field)
          guard['properties']['unavailableCurrentDimensions'] = {
              'type': 'array',
              'items': {'type': 'string', 'minLength': 1},
              'uniqueItems': True
          }
          guard['properties']['healthRevision'] = {
              'type': 'string',
              'pattern': '^[0-9a-f]{64}$'
          }
          path.write_text(json.dumps(schema, indent=2) + '\n')
          PY
          rm -f .github/workflows/pr23-diagnose-stale.yml .github/workflows/pr23-guard-schema-fix.yml
      - name: Publish source correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): close finalization guard schema"
          git push origin HEAD:agent/corte-2-plan-3-derived-health-closure
      - name: Build and verify
        run: |
          npm ci --silent
          npm run build:schemas
          npm run build:runtime
          npm run build:test-bundle
          npm run test:unit
          npm run test:cli-e2e
          npm run test:real-crash-e2e
          npm run test:security-e2e
          npm run test:bundle
          npm run verify:artifacts
          npm run verify:next-generation
          git diff --check
      - name: Publish generated artifacts
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate reviewed Corte 2 artifacts"
            git push origin HEAD:agent/corte-2-plan-3-derived-health-closure
          fi

# Execute after workflow registration.
